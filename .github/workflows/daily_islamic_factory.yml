name: "Daily Islamic History Shorts Factory"

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      factory_mode:
        description: 'Operation Mode'
        required: true
        default: 'DAILY_BATCH_5'

permissions:
  contents: write

jobs:
  produce-and-schedule-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Install FFmpeg and Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-hosny-amiri

      - name: 3. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. Install Dependencies
        run: |
          pip install -q edge-tts pillow numpy requests google-api-python-client google-auth-oauthlib

      - name: 5. Restore YouTube OAuth Token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            echo "$YOUTUBE_TOKEN_JSON" > /tmp/token_manuscripts.json
            chmod 600 /tmp/token_manuscripts.json
          else
            echo "Warning: YOUTUBE_TOKEN_JSON is not set in secrets. Running in test mode."
          fi

      - name: 6. Execute Production Factory
        env:
          ISLAMIC_FACTORY_MODE: ${{ github.event.inputs.factory_mode || 'DAILY_BATCH_5' }}
          YOUTUBE_TOKEN_PATH: /tmp/token_manuscripts.json
        run: |
          python3 run_islamic_shorts_v3_production.py

      - name: 7. Clean Up Sensitive Auth Tokens
        if: always()
        run: |
          rm -f /tmp/token_manuscripts.json

      - name: 8. Commit and Push Persistent Ledgers
        if: always()
        run: |
          git config --global user.name "ForgottenManuscriptsBot"
          git config --global user.email "bot@forgottenmanuscripts.local"
          git add -f Islamic_Shorts_Test_Lab/production_schedule_ledger.json 2>/dev/null || true
          git add -f Islamic_Shorts_Test_Lab/historical_sources_registry.json 2>/dev/null || true
          git add -f Islamic_Shorts_Test_Lab/visual_dedup_registry_v2_2.json 2>/dev/null || true
          git add -f Islamic_Shorts_Test_Lab/analytics_dashboard.csv 2>/dev/null || true
          git add -f Islamic_Shorts_Test_Lab/analytics_dashboard.json 2>/dev/null || true
          git commit -m "chore(scheduler): update production ledger [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"

      - name: 9. Upload Verification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgotten-manuscripts-qa-reports
          retention-days: 14
          if-no-files-found: ignore
          path: |
            Islamic_Shorts_Test_Lab/qa_reports/*
            Islamic_Shorts_Test_Lab/*.json
            Islamic_Shorts_Test_Lab/*.csv
